<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0b10">
<meta name="robots" content="noindex">
<title>Câmera do Telão</title>
<link rel="icon" href="/icons/favicon.svg" type="image/svg+xml">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:#0b0b10;color:#f3f2f7;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column;min-height:100dvh;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0;background:radial-gradient(500px 380px at 10% 0%,rgba(255,46,154,.20),transparent 70%),radial-gradient(500px 380px at 100% 100%,rgba(182,255,46,.10),transparent 70%);pointer-events:none}
header{display:flex;align-items:center;gap:10px;padding:18px 20px 6px;position:relative}
header b{font-size:18px;letter-spacing:-.01em}
header span{margin-left:auto;font-size:13px;color:#a3a2b6;display:flex;align-items:center;gap:7px}
.dot{width:9px;height:9px;border-radius:50%;background:#82819a;box-shadow:0 0 0 3px rgba(130,129,154,.2)}
.dot.ok{background:#2bd17e;box-shadow:0 0 0 3px rgba(43,209,126,.25)}
.dot.wait{background:#ffbe3b;box-shadow:0 0 0 3px rgba(255,190,59,.25);animation:pul 1.2s infinite}
@keyframes pul{50%{opacity:.4}}
main{flex:1;display:flex;flex-direction:column;padding:12px 16px 16px;gap:14px;position:relative}
.pv{position:relative;flex:1;min-height:300px;border-radius:26px;overflow:hidden;background:#15151d;box-shadow:0 0 0 1.5px rgba(255,255,255,.08),0 20px 60px rgba(0,0,0,.5)}
.pv video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#000}
.pv video.mirror{transform:scaleX(-1)}
.pv .ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px;padding:26px}
.pv .ov p{color:#c9c8d6;font-size:15px;line-height:1.45;max-width:320px}
.pv .ov h1{font-size:22px;letter-spacing:-.01em}
.live{position:absolute;left:14px;top:14px;background:#FF2E9A;color:#fff;font-weight:800;font-size:12px;letter-spacing:.04em;border-radius:8px;padding:5px 9px;display:none}
.live.on{display:block}
.bar{display:flex;gap:10px}
button{font:inherit;border:0;cursor:pointer}
.btn{flex:1;height:56px;border-radius:18px;background:#22222c;color:#f3f2f7;font-weight:700;font-size:16px;display:flex;align-items:center;justify-content:center;gap:9px;box-shadow:0 0 0 1.5px rgba(255,255,255,.07)}
.btn.main{background:#FF2E9A;color:#fff;box-shadow:0 10px 30px rgba(255,46,154,.35)}
.btn.red{background:#ff4d5e;color:#fff}
.btn:disabled{opacity:.5}
.note{font-size:12.5px;color:#82819a;text-align:center;line-height:1.4;display:flex;gap:7px;justify-content:center;align-items:center}
svg{flex:none}
.hidden{display:none!important}
</style>
</head>
<body>
<header>
  <svg viewBox="0 0 125 135" width="30" height="32" aria-hidden="true"><g transform="translate(5 5)" stroke="#FF2E9A" fill="none" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"><path d="M14 22 L106 18 L102 88 L18 92 Z"/><path d="M30 92 V108"/><path d="M72 90 V116"/></g><g stroke="#fff" fill="none" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"><path d="M14 22 L106 18 L102 88 L18 92 Z"/><path d="M30 92 V108"/><path d="M72 90 V116"/></g><path d="M30 60 C38 44, 50 44, 58 56 S78 70, 90 50" fill="none" stroke="#B6FF2E" stroke-width="12" stroke-linecap="round"/></svg>
  <b>Câmera do Telão</b>
  <span><i class="dot" id="dot"></i><em id="st" style="font-style:normal">Pronto</em></span>
</header>
<main>
  <div class="pv">
    <video id="v" autoplay playsinline muted></video>
    <div class="live" id="live">AO VIVO NO PC</div>
    <div class="ov" id="ov">
      <svg width="54" height="54" viewBox="0 0 24 24" fill="none" stroke="#FF2E9A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="6" y="2" width="12" height="20" rx="2.5"/><path d="M11 18h2"/></svg>
      <h1 id="ovT">Usar este celular como câmera</h1>
      <p id="ovP">Toque em começar e permita a câmera. O vídeo vai direto para o seu computador pela sua rede, sem passar por servidor nenhum.</p>
    </div>
  </div>
  <div class="bar" id="barStart"><button class="btn main" id="go">Começar</button></div>
  <div class="bar hidden" id="barLive">
    <button class="btn" id="flip" aria-label="Virar câmera"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7h13l-3-3M21 17H8l3 3"/></svg>Virar</button>
    <button class="btn red" id="stop">Parar</button>
  </div>
  <p class="note"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2 4 5v6c0 5 3.4 9.4 8 11 4.6-1.6 8-6 8-11V5z"/></svg>Deixe esta tela aberta. Só o computador que mostrou o código recebe o vídeo.</p>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/config.js"></script>
<script>
(function(){
  const $ = id => document.getElementById(id);
  const token = (location.hash.match(/[#&]t=([A-Za-z0-9_-]{16,64})/) || [])[1];
  const CFG = window.TELAO_CONFIG || {};
  let sb, ch, pc, stream, facing = 'user', wake, connected = false, ended = false;

  function status(t, kind){ $('st').textContent = t; $('dot').className = 'dot ' + (kind || ''); }
  function over(title, text){ $('ov').classList.remove('hidden'); $('ovT').textContent = title; $('ovP').textContent = text; }
  function fail(title, text){ over(title, text); $('barStart').classList.add('hidden'); $('barLive').classList.add('hidden'); status('Desligado'); }

  if(!token) return fail('Código inválido', 'Abra este link escaneando o QR code que aparece no Telão do seu computador.');
  if(!window.supabase || !CFG.SUPABASE_URL) return fail('Sem conexão', 'Não deu para carregar. Veja sua internet e escaneie o código de novo.');
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return fail('Navegador sem câmera', 'Abra o link no Chrome (Android) ou no Safari (iPhone).');

  sb = window.supabase.createClient(CFG.SUPABASE_URL, CFG.SUPABASE_ANON_KEY, { auth: { persistSession: false, autoRefreshToken: false } });
  const send = msg => ch && ch.send({ type: 'broadcast', event: 'm', payload: Object.assign({ from: 'phone' }, msg) });

  async function openCam(){
    const s = await navigator.mediaDevices.getUserMedia({ audio: false, video: { facingMode: facing, width: { ideal: 1280 }, height: { ideal: 720 }, frameRate: { ideal: 30, max: 30 } } });
    const v = $('v'); v.srcObject = s; v.classList.toggle('mirror', facing === 'user'); v.play().catch(() => {});
    return s;
  }

  async function start(){
    $('go').disabled = true; status('Abrindo a câmera…', 'wait');
    try{ stream = await openCam(); }
    catch(e){
      $('go').disabled = false;
      return fail('Câmera bloqueada', e && e.name === 'NotAllowedError' ? 'Permita a câmera para este site (no endereço lá em cima, ou nas configurações do navegador) e escaneie o código de novo.' : 'Não deu para abrir a câmera: ' + (e && e.message || e));
    }
    $('ov').classList.add('hidden'); $('barStart').classList.add('hidden'); $('barLive').classList.remove('hidden');
    try{ wake = await navigator.wakeLock.request('screen'); }catch(e){}
    status('Procurando o computador…', 'wait');
    ch = sb.channel('phonecam:' + token, { config: { broadcast: { self: false } } });
    ch.on('broadcast', { event: 'm' }, ({ payload: m }) => onMsg(m)).subscribe(st => {
      if(st === 'SUBSCRIBED'){ send({ t: 'hello', ua: navigator.userAgent.slice(0, 120) }); helloTimer(); }
    });
  }

  let hello;
  function helloTimer(){ clearInterval(hello); hello = setInterval(() => { if(!connected && !ended) send({ t: 'hello' }); }, 2500); }

  async function onMsg(m){
    if(!m || m.from !== 'pc' || ended) return;
    if(m.t === 'bye'){ return stopAll('Câmera desligada no computador', 'Pode fechar esta página. Para usar de novo, gere outro código no Telão.'); }
    if(m.t === 'taken'){ return stopAll('Outro celular já está conectado', 'Gere um código novo no computador.'); }
    if(m.sdp && m.sdp.type === 'offer'){
      if(pc) try{ pc.close(); }catch(e){}
      pc = new RTCPeerConnection({ iceServers: CFG.ICE_SERVERS || [{ urls: 'stun:stun.l.google.com:19302' }] });
      stream.getVideoTracks().forEach(t => {
        if('contentHint' in t) t.contentHint = 'motion';
        const snd = pc.addTrack(t, stream);
        const p = snd.getParameters(); if(p.encodings && p.encodings[0]){ p.encodings[0].maxBitrate = 2500000; snd.setParameters(p).catch(() => {}); }
      });
      pc.onicecandidate = e => { if(e.candidate) send({ candidate: e.candidate.toJSON() }); };
      pc.onconnectionstatechange = () => {
        const s = pc.connectionState;
        if(s === 'connected'){ connected = true; status('Conectado', 'ok'); $('live').classList.add('on'); }
        if(s === 'disconnected'){ status('Reconectando…', 'wait'); $('live').classList.remove('on'); }
        if(s === 'failed'){ connected = false; status('Sem conexão', ''); $('live').classList.remove('on'); over('Não conectou', 'O celular e o computador precisam estar na mesma rede Wi-Fi (ou a rede bloqueia conexão direta). Tente de novo.'); }
      };
      await pc.setRemoteDescription(m.sdp);
      const ans = await pc.createAnswer();
      await pc.setLocalDescription(ans);
      send({ sdp: { type: pc.localDescription.type, sdp: pc.localDescription.sdp } });
    } else if(m.candidate && pc){
      try{ await pc.addIceCandidate(m.candidate); }catch(e){}
    }
  }

  async function flip(){
    facing = facing === 'user' ? 'environment' : 'user';
    try{
      const old = stream;
      stream = await openCam();
      const t = stream.getVideoTracks()[0];
      if(pc) pc.getSenders().forEach(s => { if(s.track && s.track.kind === 'video') s.replaceTrack(t); });
      old.getTracks().forEach(x => x.stop());
    }catch(e){ facing = facing === 'user' ? 'environment' : 'user'; }
  }

  function stopAll(title, text){
    ended = true; clearInterval(hello);
    try{ send({ t: 'bye' }); }catch(e){}
    try{ pc && pc.close(); }catch(e){}
    try{ stream && stream.getTracks().forEach(t => t.stop()); }catch(e){}
    try{ wake && wake.release(); }catch(e){}
    setTimeout(() => { try{ ch && sb.removeChannel(ch); }catch(e){} }, 400);
    $('live').classList.remove('on'); $('v').srcObject = null;
    fail(title || 'Câmera desligada', text || 'Pode fechar esta página.');
  }

  $('go').onclick = start;
  $('flip').onclick = flip;
  $('stop').onclick = () => stopAll('Câmera desligada', 'Pode fechar esta página. Para usar de novo, gere outro código no Telão.');
  document.addEventListener('visibilitychange', async () => { if(document.visibilityState === 'visible' && !ended && stream && !wake){ try{ wake = await navigator.wakeLock.request('screen'); }catch(e){} } });
  window.addEventListener('pagehide', () => { if(!ended) send({ t: 'bye' }); });
})();
</script>
</body>
</html>
